<svg viewBox="40 60 380 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pyramid of proof: a foundation row of documents labelled the record, an analysis lattice above it, and one solid mark at the apex ringed in amber, the opinion">
  <!-- glynloen-meta --><title>Three steps from the record to the opinion | Glynloen Insurance Consulting</title><desc>A pyramid of proof: a foundation row of documents labelled the record, an analysis lattice above it, and one solid mark at the apex ringed in amber, the opinion</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Three steps from the record to the opinion | Glynloen Insurance Consulting</dc:title><dc:description>A pyramid of proof: a foundation row of documents labelled the record, an analysis lattice above it, and one solid mark at the apex ringed in amber, the opinion</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .ln{animation-name:twk;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes twk{0%,100%{opacity:.3}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.nd,.ln{animation:none}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:drawup 5.5s linear infinite}
    @keyframes drawup{0%{stroke-dashoffset:100;opacity:0}3%{opacity:.95}20%{stroke-dashoffset:0}50%{stroke-dashoffset:0;opacity:.95}62%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @media(prefers-reduced-motion:reduce){.drw{animation:none;opacity:0}}
  </style>

  <!-- step 1: the record (foundation of documents) -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.5" fill="none" stroke-linecap="round">
    <line x1="56" y1="369" x2="404" y2="369"/>
  </g>
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.75" fill="none">
    <rect x="59"  y="344" width="14" height="19" rx="2"/><rect x="99"  y="344" width="14" height="19" rx="2"/>
    <rect x="139" y="344" width="14" height="19" rx="2"/><rect x="179" y="344" width="14" height="19" rx="2"/>
    <rect x="219" y="344" width="14" height="19" rx="2"/><rect x="259" y="344" width="14" height="19" rx="2"/>
    <rect x="299" y="344" width="14" height="19" rx="2"/><rect x="339" y="344" width="14" height="19" rx="2"/>
    <rect x="379" y="344" width="14" height="19" rx="2"/>
  </g>
  <g stroke="#3fb0ec" stroke-width="1" opacity="0.45" stroke-linecap="round">
    <line x1="62" y1="350" x2="70" y2="350"/><line x1="102" y1="350" x2="110" y2="350"/>
    <line x1="142" y1="350" x2="150" y2="350"/><line x1="182" y1="350" x2="190" y2="350"/>
    <line x1="222" y1="350" x2="230" y2="350"/><line x1="262" y1="350" x2="270" y2="350"/>
    <line x1="302" y1="350" x2="310" y2="350"/><line x1="342" y1="350" x2="350" y2="350"/>
    <line x1="382" y1="350" x2="390" y2="350"/>
  </g>

  <!-- step 2: the analysis lattice -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.62" fill="none" stroke-linecap="round">
    <polyline points="110,252 170,252 230,252 290,252 350,252"/>
    <line x1="110" y1="252" x2="66"  y2="342"/><line x1="110" y1="252" x2="106" y2="342"/><line x1="110" y1="252" x2="146" y2="342"/>
    <line x1="170" y1="252" x2="146" y2="342"/><line x1="170" y1="252" x2="186" y2="342"/>
    <line x1="230" y1="252" x2="186" y2="342"/><line x1="230" y1="252" x2="226" y2="342"/><line x1="230" y1="252" x2="266" y2="342"/>
    <line x1="290" y1="252" x2="266" y2="342"/><line x1="290" y1="252" x2="306" y2="342"/>
    <line x1="350" y1="252" x2="306" y2="342"/><line x1="350" y1="252" x2="346" y2="342"/><line x1="350" y1="252" x2="386" y2="342"/>
  </g>

  <!-- step 3: the findings -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.62" fill="none" stroke-linecap="round">
    <line x1="170" y1="162" x2="290" y2="162"/>
    <line x1="170" y1="162" x2="110" y2="252"/><line x1="170" y1="162" x2="170" y2="252"/><line x1="170" y1="162" x2="230" y2="252"/>
    <line x1="290" y1="162" x2="230" y2="252"/><line x1="290" y1="162" x2="290" y2="252"/><line x1="290" y1="162" x2="350" y2="252"/>
  </g>

  <!-- the opinion: solid struts to the apex -->
  <g stroke="#eef2f6" stroke-width="3" opacity="0.95" fill="none" stroke-linecap="round">
    <line x1="170" y1="162" x2="230" y2="86"/>
    <line x1="290" y1="162" x2="230" y2="86"/>
  </g>


  <!-- energy rising: connections draw upward in sequence -->
  <g stroke="#57c4f2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line class="drw" pathLength="100" x1="106" y1="342" x2="110" y2="252" style="animation-delay:0s"/>
    <line class="drw" pathLength="100" x1="186" y1="342" x2="170" y2="252" style="animation-delay:.14s"/>
    <line class="drw" pathLength="100" x1="226" y1="342" x2="230" y2="252" style="animation-delay:.28s"/>
    <line class="drw" pathLength="100" x1="306" y1="342" x2="290" y2="252" style="animation-delay:.42s"/>
    <line class="drw" pathLength="100" x1="346" y1="342" x2="350" y2="252" style="animation-delay:.56s"/>
    <line class="drw" pathLength="100" x1="170" y1="252" x2="170" y2="162" style="animation-delay:1s"/>
    <line class="drw" pathLength="100" x1="230" y1="252" x2="290" y2="162" style="animation-delay:1.14s"/>
    <line class="drw" pathLength="100" x1="290" y1="252" x2="290" y2="162" style="animation-delay:1.28s"/>
  </g>
  <!-- nodes, energy rising bottom to top -->
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="66"  cy="342" r="2.6"/><circle cx="106" cy="342" r="2.6"/><circle cx="146" cy="342" r="2.6"/>
    <circle cx="186" cy="342" r="2.6"/><circle cx="226" cy="342" r="2.6"/><circle cx="266" cy="342" r="2.6"/>
    <circle cx="306" cy="342" r="2.6"/><circle cx="346" cy="342" r="2.6"/><circle cx="386" cy="342" r="2.6"/>
    <circle cx="110" cy="252" r="3.2"/><circle cx="350" cy="252" r="3.2"/>
  </g>
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="nd" cx="170" cy="252" r="4.4" style="animation-duration:3.8s;animation-delay:-2.6s"/>
    <circle class="nd" cx="230" cy="252" r="4.8" style="animation-duration:3.8s;animation-delay:-2.2s"/>
    <circle class="nd" cx="290" cy="252" r="4.4" style="animation-duration:3.8s;animation-delay:-1.8s"/>
    <circle class="nd" cx="170" cy="162" r="5.2" style="animation-duration:3.8s;animation-delay:-1.2s"/>
    <circle class="nd" cx="290" cy="162" r="5.2" style="animation-duration:3.8s;animation-delay:-0.8s"/>
  </g>
  <!-- the opinion: one large solid mark. Never animates. -->
  <g fill="#eef2f6"><circle cx="230" cy="86" r="11"/></g>
<circle cx="230" cy="86" r="18" fill="none" stroke="#d9a24e" stroke-width="2" opacity="0.9"/><text x="262" y="90" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".16em" fill="#eef2f6" opacity="0.85" text-anchor="start">THE OPINION</text><text x="418" y="256" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".16em" fill="#8fb3cf" opacity="0.85" text-anchor="end">ANALYSIS</text><text x="230" y="394" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".16em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">THE RECORD</text>
</svg>
