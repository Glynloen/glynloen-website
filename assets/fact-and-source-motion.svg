<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dated timeline of fact nodes above a row of Bates-numbered document pages; glowing threads draw each fact to its source page one by one">
  <!-- glynloen-meta --><title>Every fact linked to its source page | Glynloen Insurance Consulting</title><desc>A dated timeline of fact nodes above a row of Bates-numbered document pages; glowing threads draw each fact to its source page one by one</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Every fact linked to its source page | Glynloen Insurance Consulting</dc:title><dc:description>A dated timeline of fact nodes above a row of Bates-numbered document pages; glowing threads draw each fact to its source page one by one</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .ln{animation-name:twk;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes twk{0%,100%{opacity:.3}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.nd,.ln{animation:none}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 9s linear infinite}
    @keyframes draw{0%{stroke-dashoffset:100;opacity:0}4%{opacity:.9}22%{stroke-dashoffset:0;opacity:.9}55%{stroke-dashoffset:0;opacity:.9}68%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @media(prefers-reduced-motion:reduce){.drw{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.55}}
  </style>

