<svg viewBox="58 34 330 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The reinsurance round trip: risk ceded outward from a cedent to three reinsurers and the collections returning, one of them flagged as disputed">
  <!-- glynloen-meta --><title>Reinsurance cession and collection | Glynloen Insurance Consulting</title><desc>The reinsurance round trip: risk ceded outward from a cedent to three reinsurers and the collections returning, one of them flagged as disputed</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Reinsurance cession and collection | Glynloen Insurance Consulting</dc:title><dc:description>The reinsurance round trip: risk ceded outward from a cedent to three reinsurers and the collections returning, one of them flagged as disputed</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .out{stroke-dasharray:100;stroke-dashoffset:100;animation:cede 8s linear infinite}
    @keyframes cede{0%{stroke-dashoffset:100;opacity:0}4%{opacity:.9}20%{stroke-dashoffset:0}45%{stroke-dashoffset:0;opacity:.9}55%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .ret{stroke-dasharray:100;stroke-dashoffset:100;animation:collect 8s linear infinite}
    @keyframes collect{0%,42%{stroke-dashoffset:100;opacity:0}46%{opacity:.95}64%{stroke-dashoffset:0}84%{stroke-dashoffset:0;opacity:.95}94%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .cflash{animation:cfl 8s linear infinite}
    @keyframes cfl{0%,60%{opacity:.2}67%{opacity:1}86%{opacity:.85}96%,100%{opacity:.2}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.out,.ret{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.6}.cflash{animation:none;opacity:.8}}
  </style>

  <!-- the cedent -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.85" fill="none" stroke-linejoin="round">
    <polygon points="110,106 93,120 93,160 110,174 127,160 127,120"/>
    <line x1="93" y1="140" x2="127" y2="140"/>
    <line x1="101" y1="127" x2="119" y2="127"/><line x1="101" y1="153" x2="119" y2="153"/>
  </g>

  <!-- the reinsurers -->
  <g stroke="#3fb0ec" stroke-width="1.5" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="332,52 320,62 320,86 332,96 344,86 344,62"/>
    <polygon points="352,128 340,138 340,162 352,172 364,162 364,138"/>
    <polygon points="332,184 320,194 320,218 332,228 344,218 344,194"/>
  </g>

  <!-- threads: faint round-trip web -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M130 126C200 106 260 88 317 76"/>
    <path d="M130 140C200 142 270 148 337 150"/>
    <path d="M130 154C200 174 260 194 317 204"/>
  </g>

  <!-- cession: risk flowing out -->
  <g stroke="#57c4f2" stroke-width="2" fill="none" stroke-linecap="round">
    <path class="out" pathLength="100" d="M130 126C200 106 260 88 317 76" style="animation-delay:0s"/>
    <path class="out" pathLength="100" d="M130 140C200 142 270 148 337 150" style="animation-delay:.5s"/>
    <path class="out" pathLength="100" d="M130 154C200 174 260 194 317 204" style="animation-delay:1s"/>
  </g>

  <!-- collection: recovery flowing back -->
  <g stroke="#eaf7ff" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path class="ret" pathLength="100" d="M317 76C260 88 200 106 130 126" style="animation-delay:0s"/>
    <path class="ret" pathLength="100" d="M337 150C270 148 200 142 130 140" style="animation-delay:.5s"/>
    <path class="ret" pathLength="100" d="M317 204C260 194 200 174 130 154" style="animation-delay:1s"/>
  </g>

  <!-- nodes -->
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="93" cy="120" r="2.3"/><circle cx="93" cy="160" r="2.3"/><circle cx="127" cy="120" r="2.3"/><circle cx="127" cy="160" r="2.3"/>
    <circle cx="332" cy="52" r="2.2"/><circle cx="352" cy="128" r="2.2"/><circle cx="332" cy="184" r="2.2"/>
  </g>
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="nd" cx="332" cy="74" r="4.6" style="animation-duration:4.1s;animation-delay:-1.3s"/>
    <circle class="nd" cx="352" cy="150" r="4.6" style="animation-duration:3.7s;animation-delay:-2.6s"/>
    <circle class="nd" cx="332" cy="206" r="4.6" style="animation-duration:4.4s;animation-delay:-0.5s"/>
    <circle class="cflash" cx="110" cy="140" r="6.4"/>
  </g>
<text x="110" y="196" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">CEDENT</text><text x="340" y="246" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">REINSURERS</text><polygon points="224,167 219,176 229,176" fill="#d9a24e" opacity="0.95"/><text x="224" y="162" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="8" font-weight="700" letter-spacing=".18em" fill="#d9a24e" opacity="0.95" text-anchor="middle">DISPUTED</text>
</svg>
