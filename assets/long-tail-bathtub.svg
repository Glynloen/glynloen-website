  <!-- glynloen-meta --><title>Long tail bathtub, Glynloen Insurance Consulting</title><desc>A bathtub drawn as a coverage chart: a column for each policy year from 1976 to 1989, a base layer of water running the length of the tub from the spigot, and stepped blocks showing the coverage in each year, tallest in 1983 and 1984, with a second 1984 policy flagged at the end</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Long tail bathtub, Glynloen Insurance Consulting</dc:title><dc:description>A bathtub drawn as a coverage chart: a column for each policy year from 1976 to 1989, a base layer of water running the length of the tub from the spigot, and stepped blocks showing the coverage in each year, tallest in 1983 and 1984, with a second 1984 policy flagged at the end</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
