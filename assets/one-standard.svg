<svg viewBox="44 44 344 134" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A policyholder and a carrier, labelled, on either side of a single level line, the one standard, with the expert node above sending a retention thread to one side and then the other">
  <!-- glynloen-meta --><title>One standard for policyholder and carrier | Glynloen Insurance Consulting</title><desc>A policyholder and a carrier, labelled, on either side of a single level line, the one standard, with the expert node above sending a retention thread to one side and then the other</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>One standard for policyholder and carrier | Glynloen Insurance Consulting</dc:title><dc:description>A policyholder and a carrier, labelled, on either side of a single level line, the one standard, with the expert node above sending a retention thread to one side and then the other</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="amberglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feFlood flood-color="#d9a24e" flood-opacity=".55"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:retain 8s linear infinite}
    @keyframes retain{0%{stroke-dashoffset:100;opacity:0}4%{opacity:.95}16%{stroke-dashoffset:0}38%{stroke-dashoffset:0;opacity:.95}48%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .fl{animation:flare 8s linear infinite}
    @keyframes flare{0%,12%{opacity:.15}18%{opacity:1}38%{opacity:.85}50%,100%{opacity:.15}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.drw{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.6}.fl{animation:none;opacity:.8}}
  </style>

  <!-- the policyholder (left) -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="55,102 85,78 115,102 115,152 55,152"/>
    <line x1="55" y1="102" x2="115" y2="102"/>
    <polyline points="77,152 77,126 93,126 93,152"/>
  </g>

  <!-- the carrier (right) -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="312,84 372,84 372,152 312,152"/>
    <line x1="306" y1="84" x2="378" y2="84"/><line x1="318" y1="78" x2="366" y2="78"/>
    <line x1="324" y1="94" x2="324" y2="152"/><line x1="342" y1="94" x2="342" y2="152"/><line x1="360" y1="94" x2="360" y2="152"/>
  </g>

  <!-- one standard: a single level line between the parties, plumbed from the expert, with a small v. beneath -->
  <g stroke="#eef2f6" stroke-width="1.2" opacity="0.55" fill="none" stroke-linecap="round" stroke-dasharray="2 4">
    <line x1="213" y1="70" x2="213" y2="104"/>
  </g>
  <g stroke="#eef2f6" stroke-width="2.3" opacity="0.95" fill="none" stroke-linecap="round">
    <line x1="150" y1="110" x2="276" y2="110"/>
    <line x1="150" y1="103" x2="150" y2="117"/><line x1="276" y1="103" x2="276" y2="117"/>
  </g>
  <!-- amber accent ring (2026-09-30), as on the courthouse and disciplines graphics -->
  <circle cx="213" cy="110" r="10" fill="none" stroke="#d9a24e" stroke-width="2.2" filter="url(#amberglow)"/>
  <circle cx="213" cy="110" r="5" fill="#eef2f6" opacity="0.95"/>
  <g stroke="#eef2f6" stroke-width="1.7" opacity="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="207,129 212,143 217,129"/>
  </g>
  <circle cx="221.5" cy="142" r="1.5" fill="#eef2f6" opacity="0.85"/>

  <!-- retention threads: one side, then the other -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M200 66C170 68 145 78 120 96"/>
    <path d="M226 66C256 68 281 78 306 96"/>
  </g>
  <g stroke="#57c4f2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path class="drw" pathLength="100" d="M200 66C170 68 145 78 120 96" style="animation-delay:0s"/>
    <path class="drw" pathLength="100" d="M226 66C256 68 281 78 306 96" style="animation-delay:4s"/>
  </g>

  <!-- the parties light as retained -->
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="fl" cx="85" cy="78" r="5.2" style="animation-delay:0s"/>
    <circle class="fl" cx="342" cy="78" r="5.2" style="animation-delay:4s"/>
    <circle class="nd" cx="213" cy="60" r="6.2" style="animation-duration:3.6s;animation-delay:-0.8s"/>
  </g>

  <!-- small vertex nodes -->
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="55" cy="102" r="2.3"/><circle cx="115" cy="102" r="2.3"/><circle cx="55" cy="152" r="2.3"/><circle cx="115" cy="152" r="2.3"/>
    <circle cx="312" cy="84" r="2.3"/><circle cx="372" cy="84" r="2.3"/><circle cx="312" cy="152" r="2.3"/><circle cx="372" cy="152" r="2.3"/>
    
  </g>
<text x="85" y="171" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">POLICYHOLDER</text><text x="342" y="171" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">CARRIER</text>
</svg>
