<svg viewBox="28 44 384 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three reserve tanks for auto, general liability, and environmental lines measured against a required-reserve line; one tank's level rises to meet the line and the short tank is flagged amber">
  <!-- glynloen-meta --><title>Reserve adequacy gauge | Glynloen Insurance Consulting</title><desc>Three reserve tanks for auto, general liability, and environmental lines measured against a required-reserve line; one tank's level rises to meet the line and the short tank is flagged amber</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Reserve adequacy gauge | Glynloen Insurance Consulting</dc:title><dc:description>Three reserve tanks for auto, general liability, and environmental lines measured against a required-reserve line; one tank's level rises to meet the line and the short tank is flagged amber</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .lvl{transform-box:fill-box;transform-origin:center bottom;animation:rise 7s ease-in-out infinite}
    @keyframes rise{0%,14%{transform:scaleY(1)}52%,86%{transform:scaleY(2.28)}100%{transform:scaleY(1)}}
    .met{animation:metpls 7s ease-in-out infinite}
    @keyframes metpls{0%,45%{opacity:0}55%,84%{opacity:1}94%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.lvl{animation:none;transform:scaleY(2.28)}.met{animation:none;opacity:.9}}
  </style>

  <!-- tanks -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polyline points="70,80 70,248 134,248 134,80"/>
    <polyline points="170,80 170,248 234,248 234,80"/>
    <polyline points="270,80 270,248 334,248 334,80"/>
  </g>
  <line x1="52" y1="256" x2="352" y2="256" stroke="#3fb0ec" stroke-width="1.45" opacity="0.45" stroke-linecap="round"/>

  <!-- static fills -->
  <rect x="72" y="150" width="60" height="96" fill="#12aaeb" fill-opacity="0.16"/>
  <line x1="72" y1="150" x2="132" y2="150" stroke="#57c4f2" stroke-width="1.6" opacity="0.8"/>
  <rect x="272" y="138" width="60" height="108" fill="#12aaeb" fill-opacity="0.16"/>
  <line x1="272" y1="138" x2="332" y2="138" stroke="#57c4f2" stroke-width="1.6" opacity="0.8"/>

  <!-- the middle tank: reserves rising to the line -->
  <rect class="lvl" x="172" y="190" width="60" height="56" fill="#12aaeb" fill-opacity="0.22"/>

  <!-- the required-reserve line -->
  <g stroke="#eef2f6" stroke-width="3" opacity="0.95" fill="none" stroke-linecap="round">
    <line x1="52" y1="118" x2="352" y2="118"/>
    <polyline points="45,111 52,118 45,125"/>
  </g>
  <g stroke="#eef2f6" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
    <line x1="88" y1="118" x2="88" y2="112"/><line x1="124" y1="118" x2="124" y2="112"/>
    <line x1="188" y1="118" x2="188" y2="112"/><line x1="224" y1="118" x2="224" y2="112"/>
    <line x1="288" y1="118" x2="288" y2="112"/><line x1="324" y1="118" x2="324" y2="112"/>
  </g>

  <!-- the moment the reserve meets the line -->
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="met" cx="202" cy="118" r="5.6"/>
  </g>
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="70" cy="80" r="2.3"/><circle cx="134" cy="80" r="2.3"/>
    <circle cx="170" cy="80" r="2.3"/><circle cx="234" cy="80" r="2.3"/>
    <circle cx="270" cy="80" r="2.3"/><circle cx="334" cy="80" r="2.3"/>
  </g>
<text x="102" y="270" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">AUTO</text><text x="202" y="270" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">GL</text><text x="302" y="270" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">ENV</text><text x="60" y="108" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#eef2f6" opacity="0.75" text-anchor="start">REQUIRED</text><polygon points="102,146 97,137 107,137" fill="#d9a24e" opacity="0.95"/>
</svg>
