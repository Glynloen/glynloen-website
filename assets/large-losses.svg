<svg viewBox="48 34 304 198" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A storm striking a house with an amber lightning stroke, the loss, and the towering stack of claim-file pages it produces, the record, joined by a thread ending in one solid mark">
  <!-- glynloen-meta --><title>A large property loss and the record it produces | Glynloen Insurance Consulting</title><desc>A storm striking a house with an amber lightning stroke, the loss, and the towering stack of claim-file pages it produces, the record, joined by a thread ending in one solid mark</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>A large property loss and the record it produces | Glynloen Insurance Consulting</dc:title><dc:description>A storm striking a house with an amber lightning stroke, the loss, and the towering stack of claim-file pages it produces, the record, joined by a thread ending in one solid mark</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 8s linear infinite}
    @keyframes draw{0%{stroke-dashoffset:100;opacity:0}4%{opacity:.95}16%{stroke-dashoffset:0}42%{stroke-dashoffset:0;opacity:.95}52%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .fl{animation:flare 8s linear infinite}
    @keyframes flare{0%,14%{opacity:.15}20%{opacity:1}42%{opacity:.85}54%,100%{opacity:.15}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.drw{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.6}.fl{animation:none;opacity:.8}}
  </style>

  <!-- the storm -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="70,72 90,50 125,42 160,50 180,68 162,84 88,84"/>
  </g>
  <g stroke="#57c4f2" stroke-width="1.8" fill="none" stroke-linecap="round">
    <line class="drw" pathLength="100" x1="96" y1="92" x2="89" y2="126" style="animation-delay:0s"/>
    <line class="drw" pathLength="100" x1="121" y1="92" x2="116" y2="132" style="animation-delay:.3s"/>
    <line class="drw" pathLength="100" x1="146" y1="92" x2="141" y2="126" style="animation-delay:.6s"/>
    <line class="drw" pathLength="100" x1="168" y1="90" x2="164" y2="118" style="animation-delay:.9s"/>
  </g>

  <!-- the house -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="60,160 95,132 130,160 130,208 60,208"/>
    <line x1="60" y1="160" x2="130" y2="160"/>
    <polyline points="85,208 85,182 105,182 105,208"/>
  </g>

  <!-- the loss becomes the record -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M134 184C180 184 205 190 244 196"/>
  </g>
  <g stroke="#57c4f2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path class="drw" pathLength="100" d="M134 184C180 184 205 190 244 196" style="animation-delay:1.4s"/>
  </g>

  <!-- the record stack -->
  <g stroke="#3fb0ec" stroke-width="1.5" opacity="0.75" fill="none">
    <rect x="250" y="194" width="88" height="12" rx="2"/>
    <rect x="254" y="180" width="88" height="12" rx="2"/>
    <rect x="250" y="166" width="88" height="12" rx="2"/>
    <rect x="254" y="152" width="88" height="12" rx="2"/>
    <rect x="250" y="138" width="88" height="12" rx="2"/>
    <rect x="254" y="124" width="88" height="12" rx="2"/>
    <rect x="250" y="110" width="88" height="12" rx="2"/>
    <rect x="254" y="96" width="88" height="12" rx="2"/>
    <rect x="250" y="82" width="88" height="12" rx="2"/>
    <rect x="254" y="68" width="88" height="12" rx="2"/>
  </g>
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="fl" cx="95" cy="132" r="5" style="animation-delay:.4s"/>
    <circle class="fl" cx="344" cy="186" r="4" style="animation-delay:2.7s"/>
    <circle class="fl" cx="340" cy="144" r="4" style="animation-delay:4.2s"/>
    <circle class="fl" cx="340" cy="88" r="4" style="animation-delay:6.2s"/>
  </g>
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="60" cy="160" r="2.3"/><circle cx="130" cy="160" r="2.3"/><circle cx="70" cy="72" r="2.2"/><circle cx="180" cy="68" r="2.2"/>
    <circle cx="250" cy="60" r="2.3"/><circle cx="342" cy="206" r="2.3"/>
  </g>
<polyline class="fl" points="122,88 108,112 120,112 104,140" fill="none" stroke="#d9a24e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.2s"/><circle cx="244" cy="196" r="5" fill="#eef2f6"/><text x="95" y="226" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">THE LOSS</text><text x="296" y="226" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">THE RECORD</text>
</svg>
