<svg viewBox="28 40 396 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A business-interruption loss: revenue drops at the loss event, marked amber, recovers over the period of restoration, and rejoins the projected but-for line; the wedge between the lines is the claim">
  <!-- glynloen-meta --><title>Business interruption: the loss through the restoration period | Glynloen Insurance Consulting</title><desc>A business-interruption loss: revenue drops at the loss event, marked amber, recovers over the period of restoration, and rejoins the projected but-for line; the wedge between the lines is the claim</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>Business interruption: the loss through the restoration period | Glynloen Insurance Consulting</dc:title><dc:description>A business-interruption loss: revenue drops at the loss event, marked amber, recovers over the period of restoration, and rejoins the projected but-for line; the wedge between the lines is the claim</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 7s linear infinite}
    @keyframes draw{0%{stroke-dashoffset:100;opacity:0}6%{opacity:.95}34%{stroke-dashoffset:0}68%{stroke-dashoffset:0;opacity:.95}80%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .gap{animation:gapfade 7s linear infinite}
    @keyframes gapfade{0%,10%{opacity:0}38%,68%{opacity:1}80%,100%{opacity:0}}
    .done{animation:donep 7s linear infinite}
    @keyframes donep{0%,32%{opacity:.15}38%{opacity:1}68%{opacity:.9}82%,100%{opacity:.15}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.drw{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.85}.gap{animation:none;opacity:1}.done{animation:none;opacity:.8}}
  </style>

  <!-- axes -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.5" fill="none" stroke-linecap="round">
    <polyline points="42,52 42,244 408,244"/>
    <line x1="38" y1="90" x2="46" y2="90"/><line x1="38" y1="146" x2="46" y2="146"/><line x1="38" y1="202" x2="46" y2="202"/>
  </g>

  <!-- the claim: wedge between actual and but-for -->
  <polygon class="gap" points="205,168 265,158 325,151 378,146 345,168 305,196 265,220 225,232" fill="#57c4f2" opacity="0" fill-opacity="0.10"/>

  <!-- actual revenue: drop and recovery -->
  <g stroke="#3fb0ec" stroke-width="1.8" opacity="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="55,182 110,172 165,176 205,168"/>
    <polyline points="205,168 225,232 265,220 305,196 345,168 378,146"/>
  </g>
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="55" cy="182" r="2.6"/><circle cx="110" cy="172" r="2.6"/><circle cx="165" cy="176" r="2.6"/>
    <circle cx="225" cy="232" r="2.6"/><circle cx="265" cy="220" r="2.6"/><circle cx="305" cy="196" r="2.6"/><circle cx="345" cy="168" r="2.6"/>
  </g>

  <!-- the but-for line, drawing itself across the loss period -->
  <g stroke="#eaf7ff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline class="drw" pathLength="100" points="205,168 265,158 325,151 378,146"/>
  </g>

  <!-- period of restoration -->
  <g stroke="#3fb0ec" stroke-width="1.3" opacity="0.55" fill="none" stroke-linecap="round">
    <line x1="205" y1="262" x2="378" y2="262"/>
    <line x1="205" y1="256" x2="205" y2="268"/><line x1="378" y1="256" x2="378" y2="268"/>
  </g>

  <!-- loss event and recovery complete -->
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="nd" cx="205" cy="168" r="6" style="animation-duration:3.4s;animation-delay:-0.6s"/>
    <circle class="done" cx="378" cy="146" r="5"/>
  </g>
<polygon points="205,158 200,149 210,149" fill="#d9a24e" opacity="0.95"/><text x="205" y="142" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">LOSS EVENT</text><text x="300" y="138" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#eef2f6" opacity="0.8" text-anchor="middle">BUT-FOR</text><text x="312" y="216" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">ACTUAL</text><text x="291" y="280" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="8.5" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">PERIOD OF RESTORATION</text><text x="36" y="62" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" letter-spacing=".18em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">$</text>
</svg>
