<svg viewBox="14 32 352 132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Department's building sends a demand to the response document; thin threads draw each item of the demand to the record that answers it, and the response is certified with one solid mark on its signature rule">
  <!-- glynloen-meta --><title>A certified response to a subpoena | Glynloen Insurance Consulting</title><desc>The Department's building sends a demand to the response document; thin threads draw each item of the demand to the record that answers it, and the response is certified with one solid mark on its signature rule</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title>A certified response to a subpoena | Glynloen Insurance Consulting</dc:title><dc:description>The Department's building sends a demand to the response document; thin threads draw each item of the demand to the record that answers it, and the response is certified with one solid mark on its signature rule</dc:description><dc:creator>Glynloen Insurance Consulting</dc:creator><dc:publisher>Glynloen Insurance Consulting</dc:publisher><dc:rights>© 2026 Glynloen Insurance Consulting. All rights reserved.</dc:rights><dc:source>https://glynloen.com/</dc:source></rdf:Description></rdf:RDF></metadata><!-- /glynloen-meta -->
  <defs>
    <radialGradient id="amb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff4df"/><stop offset="55%" stop-color="#ecbd72"/><stop offset="100%" stop-color="#d9a24e"/></radialGradient>
    <filter id="aglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#d9a24e" flood-opacity=".6"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf7ff"/><stop offset="55%" stop-color="#57c4f2"/><stop offset="100%" stop-color="#12aaeb"/></radialGradient>
  </defs>
  <style>
    .nd{transform-box:fill-box;transform-origin:center;animation-name:pls;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes pls{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .drw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 9s linear infinite}
    @keyframes draw{0%{stroke-dashoffset:100;opacity:0}3%{opacity:.95}14%{stroke-dashoffset:0}46%{stroke-dashoffset:0;opacity:.95}56%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    .fl{animation:flare 9s linear infinite}
    @keyframes flare{0%,12%{opacity:.15}18%{opacity:1}46%{opacity:.85}58%,100%{opacity:.15}}
    @media(prefers-reduced-motion:reduce){.nd{animation:none}.drw{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.6}.fl{animation:none;opacity:.8}}
  </style>

  <!-- the Department -->
  <g stroke="#3fb0ec" stroke-width="1.6" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="28,74 64,52 100,74"/>
    <line x1="24" y1="74" x2="104" y2="74"/>
    <line x1="36" y1="82" x2="36" y2="128"/><line x1="55" y1="82" x2="55" y2="128"/><line x1="73" y1="82" x2="73" y2="128"/><line x1="92" y1="82" x2="92" y2="128"/>
    <line x1="28" y1="128" x2="100" y2="128"/><line x1="22" y1="136" x2="106" y2="136"/>
  </g>
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="28" cy="74" r="2.3"/><circle cx="100" cy="74" r="2.3"/><circle cx="22" cy="136" r="2.3"/><circle cx="106" cy="136" r="2.3"/>
  </g>
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="nd" cx="64" cy="52" r="5.2" style="animation-duration:3.6s;animation-delay:-1s"/>
  </g>

  <!-- the demand arrives -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.22" fill="none" stroke-linecap="round">
    <line x1="110" y1="94" x2="158" y2="94"/>
  </g>
  <g stroke="#57c4f2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line class="drw" pathLength="100" x1="110" y1="94" x2="156" y2="94" style="animation-delay:0s"/>
    <polyline class="drw" pathLength="100" points="147,87 156,94 147,101" style="animation-delay:.5s"/>
  </g>

  <!-- the response: the firm's document -->
  <g stroke="#eef2f6" stroke-width="2.6" opacity="0.95" fill="none" stroke-linejoin="round">
    <rect x="166" y="40" width="64" height="104" rx="4"/>
  </g>
  <g stroke="#3fb0ec" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
    <line x1="178" y1="58" x2="218" y2="58"/><line x1="178" y1="74" x2="212" y2="74"/><line x1="178" y1="90" x2="218" y2="90"/><line x1="178" y1="106" x2="208" y2="106"/>
  </g>
  <g fill="#3fb0ec" opacity="0.9">
    <circle cx="218" cy="58" r="2.6"/><circle cx="218" cy="74" r="2.6"/><circle cx="218" cy="90" r="2.6"/><circle cx="218" cy="106" r="2.6"/>
  </g>

  <!-- the records that answer -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.75" fill="none" stroke-linejoin="round">
    <rect x="282" y="44" width="76" height="11" rx="2"/><rect x="282" y="60" width="76" height="11" rx="2"/><rect x="282" y="76" width="76" height="11" rx="2"/>
    <rect x="282" y="92" width="76" height="11" rx="2"/><rect x="282" y="108" width="76" height="11" rx="2"/><rect x="282" y="124" width="76" height="11" rx="2"/>
  </g>
  <g stroke="#3fb0ec" stroke-width="1" opacity="0.45" stroke-linecap="round">
    <line x1="290" y1="49.5" x2="316" y2="49.5"/><line x1="290" y1="65.5" x2="324" y2="65.5"/><line x1="290" y1="81.5" x2="310" y2="81.5"/>
    <line x1="290" y1="97.5" x2="320" y2="97.5"/><line x1="290" y1="113.5" x2="306" y2="113.5"/><line x1="290" y1="129.5" x2="318" y2="129.5"/>
  </g>

  <!-- each demand drawn to its record -->
  <g stroke="#3fb0ec" stroke-width="1.45" opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M218 58C250 58 250 49.5 282 49.5"/><path d="M218 74C250 74 250 81.5 282 81.5"/>
    <path d="M218 90C250 90 250 113.5 282 113.5"/><path d="M218 106C250 106 250 129.5 282 129.5"/>
  </g>
  <g stroke="#57c4f2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path class="drw" pathLength="100" d="M218 58C250 58 250 49.5 282 49.5" style="animation-delay:1.2s"/>
    <path class="drw" pathLength="100" d="M218 74C250 74 250 81.5 282 81.5" style="animation-delay:1.7s"/>
    <path class="drw" pathLength="100" d="M218 90C250 90 250 113.5 282 113.5" style="animation-delay:2.2s"/>
    <path class="drw" pathLength="100" d="M218 106C250 106 250 129.5 282 129.5" style="animation-delay:2.7s"/>
  </g>
  <g fill="url(#node)" filter="url(#glow)">
    <circle class="fl" cx="282" cy="49.5" r="4.2" style="animation-delay:1.2s"/>
    <circle class="fl" cx="282" cy="81.5" r="4.2" style="animation-delay:1.7s"/>
    <circle class="fl" cx="282" cy="113.5" r="4.2" style="animation-delay:2.2s"/>
    <circle class="fl" cx="282" cy="129.5" r="4.2" style="animation-delay:2.7s"/>
  </g>

  <!-- the certification: one solid mark on the signature rule. Never animates. -->
  <g stroke="#eef2f6" stroke-width="1.6" opacity="0.9" fill="none" stroke-linecap="round">
    <line x1="178" y1="128" x2="202" y2="128"/>
  </g>
  <g fill="url(#amb)" filter="url(#aglow)"><circle class="nd" cx="212" cy="128" r="6" style="animation-duration:3.6s;animation-delay:-2s"/></g>
<text x="64" y="156" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".16em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">THE DEPARTMENT</text><text x="198" y="160" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".16em" fill="#eef2f6" opacity="0.8" text-anchor="middle">THE RESPONSE</text><text x="320" y="156" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing=".16em" fill="#8fb3cf" opacity="0.85" text-anchor="middle">THE RECORDS</text>
</svg>
